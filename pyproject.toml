[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "source"
version = "0.1.0"
description = "Unitree G1 MMD retargeting and dance tracking on Isaac Lab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "jasy" }]
dependencies = ["numpy>=2", "h5py>=3.15", "PyYAML>=6"]

[project.optional-dependencies]
audio = ["pygame>=2.6"]
retarget = ["scipy>=1.11", "clarabel>=0.11", "trimesh>=4", "python-fcl>=0.7"]
test = ["scipy>=1.11", "clarabel>=0.11", "Pillow>=10", "imageio-ffmpeg>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["source*"]
